<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141E30" />

    <!-- 🔹 Название сайта -->
    <title>Телемастерская Ярослава Николаевича</title>

    <!-- 🔹 Описание для поисковиков -->
    <meta
      name="description"
      content="Телемастерская Ярослава Николаевича — профессиональный ремонт бытовой техники, услуги, контакты и отзывы."
    />

    <!-- 🔹 Фавиконки для браузеров -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=2"
    />
    <link rel="icon" href="/favicon.ico?v=2" />

    <!-- 🔹 Apple Touch Icon (для ярлыка на iPhone/iPad) -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />

    <!-- 🔹 Open Graph (для соцсетей: VK, Telegram, WhatsApp, Facebook) -->
    <meta property="og:title" content="Телемастерская Ярослава Николаевича" />
    <meta
      property="og:description"
      content="Профессиональный ремонт бытовой техники. Сервис, опыт, надежность и гарантия."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://telemasterskaya.ru" />
    <meta
      property="og:image"
      content="https://telemasterskaya.ru/preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 🔹 Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Телемастерская Ярослава Николаевича" />
    <meta
      name="twitter:description"
      content="Профессиональный ремонт бытовой техники. Сервис, опыт, надежность и гарантия."
    />
    <meta
      name="twitter:image"
      content="https://telemasterskaya.ru/preview.png"
    />

    <!-- 🔹 Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- 🔹 CSS и JS сборки React -->
    <!-- Эти файлы вставляются автоматически при сборке React (npm run build) -->
  </head>
  <body>
    <noscript>Чтобы использовать приложение, включите JavaScript.</noscript>
    <div id="root"></div>
    <!-- React JS вставляется автоматически при сборке -->
  </body>
</html>
