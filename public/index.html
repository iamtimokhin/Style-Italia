<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1B1B1B" />

    <!-- 🔹 Название сайта -->
    <title>
      Style Italia — магазин мужской и женской одежды Елены Ратковской
    </title>

    <!-- 🔹 Описание для поисковиков -->
    <meta
      name="description"
      content="Style Italia — магазин мужской и женской одежды Елены Ратковской. Европейский стиль, актуальные коллекции, качество и индивидуальный подход."
    />

    <!-- 🔹 Фавиконки -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png?v=2"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png?v=2"
    />
    <link rel="icon" href="/favicon.ico?v=2" />

    <!-- 🔹 Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />

    <!-- 🔹 Open Graph (для соцсетей) -->
    <meta
      property="og:title"
      content="Style Italia — одежда Елены Ратковской"
    />
    <meta
      property="og:description"
      content="Магазин мужской и женской одежды в европейском стиле. Элегантность, комфорт и качество — Style Italia от Елены Ратковской."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://styleitalia.ru" />
    <meta property="og:image" content="https://styleitalia.ru/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- 🔹 Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Style Italia — одежда Елены Ратковской"
    />
    <meta
      name="twitter:description"
      content="Европейский стиль и высокое качество — мужская и женская одежда Style Italia от Елены Ратковской."
    />
    <meta name="twitter:image" content="https://styleitalia.ru/preview.png" />

    <!-- 🔹 Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- 🔹 CSS и JS сборки React -->
    <!-- Эти файлы вставляются автоматически при сборке React (npm run build) -->
  </head>
  <body>
    <noscript>Чтобы использовать приложение, включите JavaScript.</noscript>
    <div id="root"></div>
    <!-- React JS вставляется автоматически при сборке -->
  </body>
</html>
